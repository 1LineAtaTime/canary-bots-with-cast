name: Crystal to Canary item ID mapping

on:
  push:
    branches:
      - crystal-items-monsters-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Crystal -> Canary ID map
        run: python3 tools/migration/map_items.py
      - name: Commit generated mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/migration
          git diff --cached --quiet || git commit -m 'data: map Crystal item IDs to Canary'
          git push
