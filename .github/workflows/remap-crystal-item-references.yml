name: Remap Crystal item references

on:
  workflow_dispatch:
  push:
    branches:
      - crystal-items-monsters-migration

permissions:
  contents: write

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify existing Crystal -> Canary map
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/items/item_id_map.json')
          rows = json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(rows, list) and len(rows) > 1000, 'invalid or incomplete item map'
          targets = [int(r['canary_id']) for r in rows]
          assert len(targets) == len(set(targets)), 'duplicate Canary target IDs'
          print(f'validated {len(rows)} item mappings')
          PY

      - name: Rewrite item references
        run: python3 tools/migration/remap_item_references.py

      - name: Validate remap report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/migration/item_reference_remap_report.md')
          text = p.read_text(encoding='utf-8')
          assert 'files changed:' in text
          assert 'references changed:' in text
          print(text)
          PY

      - name: Commit remapped data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tools/migration/remap_item_references.py tools/migration/item_reference_remap_report.md data data-otservbr-global
          if git diff --cached --quiet; then
            echo 'No remapped references to commit.'
          else
            git commit -m 'data: remap Crystal item references to Canary IDs'
            git push origin HEAD:crystal-items-monsters-migration
          fi
