name: Remap Crystal item references

on:
  workflow_dispatch:
  push:
    branches:
      - crystal-items-monsters-migration

permissions:
  contents: write

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Crystal -> Canary item map
        run: python3 tools/migration/map_items.py

      - name: Rewrite item references
        run: python3 tools/migration/remap_item_references.py

      - name: Validate generated XML and mapping
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('tools/migration/items_crystal_to_canary.xml')
          m = json.loads(Path('tools/migration/item_id_map.json').read_text())
          entries = m['entries']
          targets = [int(v['target_id']) for v in entries.values()]
          assert len(targets) == len(set(targets)), 'duplicate Canary target IDs'
          print('validated', len(entries), 'item mappings')
          PY

      - name: Commit remapped data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/migration data/items data-otservbr-global
          git diff --cached --quiet || git commit -m 'data: remap Crystal item references to Canary IDs'
          git push
