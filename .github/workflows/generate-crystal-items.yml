name: Generate Crystal to Canary item map

on:
  workflow_dispatch:
  push:
    branches:
      - crystal-items-monsters-migration

permissions:
  contents: write

jobs:
  map-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run item mapper
        run: python3 tools/migration/map_items.py

      - name: Validate generated map
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/items/item_id_map.json')
          rows = json.loads(p.read_text())
          ids = [r['canary_id'] for r in rows]
          assert len(ids) == len(set(ids)), 'duplicate Canary IDs detected'
          assert Path('data/items/items.xml').exists()
          assert Path('data/items/item_id_map.csv').exists()
          assert Path('data/items/CRYSTAL_CANARY_ID_MAP.md').exists()
          print(f'validated {len(rows)} mapped items')
          PY

      - name: Commit generated item data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add -f data/items/items.xml data/items/item_id_map.json data/items/item_id_map.csv data/items/CRYSTAL_CANARY_ID_MAP.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'data: map Crystal items to Canary IDs'
            git push origin HEAD:crystal-items-monsters-migration
          fi
