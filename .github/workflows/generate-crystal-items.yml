name: Generate Crystal to Canary item map

on:
  workflow_dispatch:
  push:
    branches:
      - crystal-items-monsters-migration

permissions:
  contents: write

jobs:
  map-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Crystal items
        run: |
          curl -L --fail https://raw.githubusercontent.com/zimbadev/crystalserver/main/data/items/items.xml -o /tmp/crystal-items.xml

      - name: Map Crystal IDs to Canary IDs
        run: |
          python3 - <<'PY'
          import csv, json, re
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          crystal = Path('/tmp/crystal-items.xml').read_text(encoding='latin1')
          canary_path = Path('data/items/items.xml')
          canary = canary_path.read_text(encoding='latin1')

          def parse(text):
              root = ET.fromstring(text)
              return [(int(e.get('id')), e.get('name', '')) for e in root.findall('.//item') if e.get('id')]

          c_items = parse(crystal)
          a_items = parse(canary)
          can_by_id = {i:n for i,n in a_items}
          by_name = defaultdict(list)
          for i,n in a_items:
              by_name[n.strip().lower()].append(i)

          used = set(can_by_id)
          mapping, reason = {}, {}
          for cid, name in c_items:
              nm = name.strip().lower()
              if cid in can_by_id and can_by_id[cid].strip().lower() == nm and cid not in mapping.values():
                  mapping[cid] = cid; reason[cid] = 'same_id_same_name'; used.add(cid)
              elif cid not in used:
                  mapping[cid] = cid; reason[cid] = 'free_id_preserved'; used.add(cid)
              elif len(by_name.get(nm, [])) == 1 and by_name[nm][0] not in used:
                  mapping[cid] = by_name[nm][0]; reason[cid] = 'unique_name_match'; used.add(mapping[cid])
              else:
                  mapping[cid] = None

          next_id = max(used, default=0) + 1
          for cid in mapping:
              if mapping[cid] is None:
                  while next_id in used: next_id += 1
                  mapping[cid] = next_id; reason[cid] = 'new_free_id'; used.add(next_id); next_id += 1

          pattern = re.compile(r'(<item\\b[^>]*?\\bid\\s*=\\s*["\\'])(\\d+)(["\\'])', re.I)
          matches = list(pattern.finditer(crystal))
          if len(matches) != len(c_items):
              raise SystemExit(f'item tag mismatch: {len(matches)} != {len(c_items)}')
          pieces, last = [], 0
          for (cid, _), m in zip(c_items, matches):
              pieces.append(crystal[last:m.start(2)]); pieces.append(str(mapping[cid])); last = m.end(2)
          pieces.append(crystal[last:])
          canary_path.write_text(''.join(pieces), encoding='latin1')

          rows = [{'crystal_id': cid, 'canary_id': mapping[cid], 'name': name, 'reason': reason[cid]} for cid,name in c_items]
          Path('data/items/item_id_map.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          with Path('data/items/item_id_map.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.writer(f); w.writerow(['crystal_id','canary_id','name','reason'])
              for r in rows: w.writerow([r['crystal_id'],r['canary_id'],r['name'],r['reason']])

          counts = defaultdict(int)
          for r in reason.values(): counts[r] += 1
          Path('data/items/CRYSTAL_CANARY_ID_MAP.md').write_text(
              f'# Crystal -> Canary item ID map\n\nCrystal items: {len(c_items)}\nOriginal Canary items: {len(a_items)}\nUnique mapped IDs: {len(set(mapping.values()))}\nMaximum mapped ID: {max(mapping.values())}\n\n'
              f"- same ID + same name: {counts['same_id_same_name']}\n- free Crystal ID preserved: {counts['free_id_preserved']}\n- unique name match: {counts['unique_name_match']}\n- new IDs allocated: {counts['new_free_id']}\n",
              encoding='utf-8')
          PY

      - name: Commit generated item data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/items/items.xml data/items/item_id_map.json data/items/item_id_map.csv data/items/CRYSTAL_CANARY_ID_MAP.md
          git diff --cached --quiet || git commit -m 'data: map Crystal items to Canary IDs'
          git push
